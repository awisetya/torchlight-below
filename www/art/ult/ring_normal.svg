<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <title>Torchlight Below - Ultimate charge gauge frame</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#fff0b0"/><stop offset="0.12" stop-color="#bf8241"/><stop offset="0.27" stop-color="#4e3020"/>
      <stop offset="0.46" stop-color="#e9c783"/><stop offset="0.64" stop-color="#78512a"/><stop offset="0.82" stop-color="#d3a965"/><stop offset="1" stop-color="#412518"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#32231d"/><stop offset="0.52" stop-color="#62462f"/><stop offset="1" stop-color="#231b1b"/>
    </linearGradient>
    <radialGradient id="gem"><stop offset="0" stop-color="#ffe2a0"/><stop offset="0.38" stop-color="#d7a352"/><stop offset="1" stop-color="#60402c"/></radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.8"/></filter>
    <g id="rune"><path d="M128 13 L133 22 L128 28 L123 22 Z" fill="url(#edge)" stroke="#3a291b" stroke-width="1"/><path d="M128 17 L128 23" fill="none" stroke="#ffe1a2" stroke-width="1.1"/></g>
    <g id="tick"><path d="M128 29 L128 35" stroke="#9a7b4b" stroke-width="1.5" stroke-linecap="round"/></g>
  </defs>
  <!-- Black is only an export-preview backing in some viewers: the central hole remains transparent. -->
  <circle cx="128" cy="128" r="111" fill="none" stroke="#120f12" stroke-width="9" opacity="0.38" filter="url(#drop)"/>
  <circle cx="128" cy="128" r="109" fill="none" stroke="#342519" stroke-width="10"/>
  <circle cx="128" cy="128" r="109.5" fill="none" stroke="url(#edge)" stroke-width="4.8"/>
  <circle cx="128" cy="128" r="99.5" fill="none" stroke="url(#track)" stroke-width="17"/>
  <circle cx="128" cy="128" r="104.6" fill="none" stroke="#b88a51" stroke-width="1.8" opacity="0.82"/>
  <circle cx="128" cy="128" r="94.3" fill="none" stroke="#1b1314" stroke-width="5"/>
  <circle cx="128" cy="128" r="89.7" fill="none" stroke="url(#edge)" stroke-width="3.2"/>
  <circle cx="128" cy="128" r="87.1" fill="none" stroke="#dfbb78" stroke-width="0.9" opacity="0.64"/>
  <circle cx="128" cy="128" r="117" fill="none" stroke="#ba8545" stroke-width="0.9" stroke-dasharray="1 8" opacity="0.52"/>
  <g opacity="0.95">
    <use xlink:href="#rune"/><use xlink:href="#rune" transform="rotate(90 128 128)"/>
    <use xlink:href="#rune" transform="rotate(180 128 128)"/><use xlink:href="#rune" transform="rotate(270 128 128)"/>
  </g>
  <g opacity="0.8">
    <use xlink:href="#tick" transform="rotate(15 128 128)"/><use xlink:href="#tick" transform="rotate(30 128 128)"/>
    <use xlink:href="#tick" transform="rotate(45 128 128)"/><use xlink:href="#tick" transform="rotate(60 128 128)"/>
    <use xlink:href="#tick" transform="rotate(75 128 128)"/><use xlink:href="#tick" transform="rotate(105 128 128)"/>
    <use xlink:href="#tick" transform="rotate(120 128 128)"/><use xlink:href="#tick" transform="rotate(135 128 128)"/>
    <use xlink:href="#tick" transform="rotate(150 128 128)"/><use xlink:href="#tick" transform="rotate(165 128 128)"/>
    <use xlink:href="#tick" transform="rotate(195 128 128)"/><use xlink:href="#tick" transform="rotate(210 128 128)"/>
    <use xlink:href="#tick" transform="rotate(225 128 128)"/><use xlink:href="#tick" transform="rotate(240 128 128)"/>
    <use xlink:href="#tick" transform="rotate(255 128 128)"/><use xlink:href="#tick" transform="rotate(285 128 128)"/>
    <use xlink:href="#tick" transform="rotate(300 128 128)"/><use xlink:href="#tick" transform="rotate(315 128 128)"/>
    <use xlink:href="#tick" transform="rotate(330 128 128)"/><use xlink:href="#tick" transform="rotate(345 128 128)"/>
  </g>
  <g opacity="0.92">
    <path d="M121 12 L128 3 L135 12 L128 20 Z" fill="url(#gem)" stroke="#372312" stroke-width="1.6"/>
    <path d="M121 244 L128 253 L135 244 L128 236 Z" fill="url(#gem)" stroke="#372312" stroke-width="1.6"/>
    <path d="M12 121 L3 128 L12 135 L20 128 Z" fill="url(#gem)" stroke="#372312" stroke-width="1.6"/>
    <path d="M244 121 L253 128 L244 135 L236 128 Z" fill="url(#gem)" stroke="#372312" stroke-width="1.6"/>
    <path d="M128 6 L128 17 M128 239 L128 250 M6 128 L17 128 M239 128 L250 128" stroke="#ffe7a1" stroke-width="1" opacity="0.73"/>
